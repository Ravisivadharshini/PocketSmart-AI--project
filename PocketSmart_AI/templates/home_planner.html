{% extends "base.html" %}
{% block title %}Home Planner{% endblock %}
{% block content %}
<div class="form-card">
<h1>Home Interior Budget Planner</h1>
<form class="planner-form" data-endpoint="/generate-home">
<label>Budget (₹)<input type="number" name="budget" min="1" required></label>
<label>Room type
<select name="room_type"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option></select></label>
<label>Items needed<input name="items" placeholder="Lights, fan, table, sofa"></label>
<label>Style<select name="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Luxury</option></select></label>
<button class="btn" type="submit">Generate Recommendations</button>
</form>
<div id="result"></div>
</div>
{% endblock %}
