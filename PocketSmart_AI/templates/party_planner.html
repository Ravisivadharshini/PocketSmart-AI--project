{% extends "base.html" %}
{% block title %}Party Planner{% endblock %}
{% block content %}
<div class="form-card">
<h1>Party Budget Planner</h1>
<form class="planner-form" data-endpoint="/generate-party">
<label>Budget (₹)<input type="number" name="budget" min="1" required></label>
<label>Guests<input type="number" name="guests" min="1" required></label>
<label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Family Function</option></select></label>
<label>Venue preference<input name="venue" placeholder="Home, Hall, Outdoor..."></label>
<label>Preferences<input name="preferences" placeholder="Vegetarian food, theme, music..."></label>
<button class="btn" type="submit">Generate Recommendations</button>
</form>
<div id="result"></div>
</div>
{% endblock %}
